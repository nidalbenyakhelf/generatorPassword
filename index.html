<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>generatorPassword</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Password Generator</h1>
      <div class="inputBox">
        <div id="inputBox"></div>
      </div>
      <div class="passwordLength">
        <input type="range" min="1" max="24" id="range" />
        <span>Password Length:</span>
        <span id="passwordLengthValue"></span>
      </div>
      <div class="condation" id="condation">
        <div class="group">
          <button id="Lletter" value="Lletter"></button>
          <span>Inclaude LowerCase Letter (a-z)</span>
        </div>
        <div class="group">
          <button id="Uletter" value="Uletter"></button>
          <span>Inclaude UpperCase Letter (A-Z)</span>
        </div>
        <div class="group">
          <button id="number" value="number"></button>
          <span>Inclaude Number (1-9)</span>
        </div>
        <div class="group">
          <button id="symbols" value="Sympols"></button>
          <span>Inclaude Sympols (!-@)</span>
        </div>
      </div>
      <button id="generatorBtn">Generator Password</button>
    </div>
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
